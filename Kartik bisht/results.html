<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather - Best Hour</title>
  <meta name="description" content="Current weather, the best hour for your plan, and a 5-day forecast.">
  <link rel="stylesheet" href="style.css">
</head>

<body data-sky="sunny">
  <header>
    <nav>
      <a class="back" href="index.html"><span class="arrow">←</span> Search another place</a>
      <select id="unitSelect" aria-label="Temperature unit">
        <option value="C">°C Celsius</option>
        <option value="F">°F Fahrenheit</option>
        <option value="K">K Kelvin</option>
      </select>
    </nav>
  </header>

  <main>
    <!-- Shows "Loading..." or an error. results.js fills it in. -->
    <p class="card" id="message">Loading weather...</p>

    <!-- ERROR PAGE: hidden until a place is not found (results.js shows it) -->
    <section class="card error" id="errorBox" hidden>
      <div class="error-art"><span>🔍</span></div>   <!-- delete this span if you use your own GIF -->
      <h2 id="errorTitle"></h2>
      <p id="errorText"></p>
      <form id="retryForm">
        <input type="text" id="retryInput" placeholder="Try another place" required>
        <button type="submit">Try again</button>
      </form>
      <a class="chip" href="index.html">← Back to home</a>
    </section>

    <!-- Everything inside #app is hidden until the data arrives -->
    <div id="app" hidden>

      <!-- Card 1: current weather -->
      <section class="card now">
        <div>
          <h1 id="placeName"></h1>
          <div class="temp"><span id="icon"></span> <span id="temp"></span></div>
          <p id="cond"></p>
          <p id="details"></p>
        </div>
        <p class="outfit" id="outfit"></p>
      </section>

      <!-- Card 2: the unique feature - pick a plan, find the best hour -->
      <section class="card">
        <h2>What are you planning today?</h2>
        <div class="chips" id="chips"></div>
        <p class="verdict" id="verdict"></p>
        <div class="bars" id="bars"></div>
        <div class="hours" id="hours"></div>
        <p id="picked">Tap a bar to see that hour.</p>
      </section>

      <!-- Card 3: next 5 days -->
      <section class="card">
        <h2>Next 5 days</h2>
        <div class="days" id="days"></div>
      </section>

    </div>
  </main>

  <footer>Internet Programming project</footer>

  <script src="results.js"></script>
</body>
</html>
